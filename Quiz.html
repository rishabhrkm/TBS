<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Viswanathan Anand Birthday Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container" id="container">
    <form id="start-form" class="centered">
      <img src="tbs-logo.png" alt="Viswanathan Anand">
      <h1><i class="fas fa-chess-king"></i> The Board Slashers</h1>
      <h2>Viswanathan Anand Birthday Quiz</h2>
      <p>Test your knowledge about India's chess legend!</p><br>
      <p>Quiz Will Start on 11th Dec @8PM Sharp!</p>
      <input type="text" id="username_1" placeholder="Enter your name" required/>
      <button type="submit">
        <i class="fas fa-play-circle"></i> Start Quiz
      </button>
      <p style="margin-top: 20px; color: #b8c1ec; font-size: 0.9em;">
        <i class="fas fa-info-circle"></i> 10 questions about Anand's life and career
      </p>
    </form>
  </div>
  <script src="quiz.js"></script>
<script>
// Disable Right-Click
document.addEventListener('contextmenu', event => event.preventDefault());

// Disable Keys (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+Shift+C)
document.onkeydown = function (e) {
    // F12
    if (e.keyCode === 123) return false;

    // CTRL+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) return false;

    // CTRL+Shift+J
    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) return false;

    // CTRL+U
    if (e.ctrlKey && e.keyCode === 85) return false;

    // CTRL+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) return false;
};

// Detect DevTools Opening (bypassable but annoying)
(function() {
    const element = new Image();
    Object.defineProperty(element, 'id', {
        get: function () {
            alert("DevTools is opened!");
        }
    });
    console.log(element);
})();
</script>

</body>
</html>
